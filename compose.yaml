services:
  text2cypher:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GRAPH_MODE: ${GRAPH_MODE:-demo}
      GRAPH_SCHEMA: ${GRAPH_SCHEMA:-/app/backend/data/schema.demo.json}
      KB_SEED: ${KB_SEED:-}
      SQLITE_PATH: ${SQLITE_PATH:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_USER: ${NEO4J_USER:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_SEMANTIC_RERANK: ${LLM_SEMANTIC_RERANK:-0}
      CODE_COMMIT: ${CODE_COMMIT:-local}
    volumes:
      - state:/app/artifacts
      - ./backend/data:/app/backend/data:ro
volumes:
  state:
